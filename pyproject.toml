[project]
name = "corpora"
version = "0.0.1"
description = "Unit tests for AI that reads your company's documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5"]
xlsx = ["openpyxl>=3.1"]
# PDF text extraction is non-deterministic across versions. Pin exactly; the version is
# stamped into every Snapshot and anchors are only valid within it.
pdf = ["pymupdf==1.24.10"]

[project.scripts]
corpora = "corpora.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not llm'"
markers = ["llm: touches a live model API; excluded from the default run"]

[tool.mypy]
strict = true
files = ["src/corpora"]

[tool.ruff]
line-length = 90
target-version = "py311"
